<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>English Review Sync 设置</title>
    <style>
      body { margin: 0; background: #f7f7f2; color: #172223; font: 15px/1.55 system-ui, sans-serif; }
      main { max-width: 650px; margin: 48px auto; padding: 28px; background: #fff; border: 1px solid #dce4dc; border-radius: 16px; }
      label { display: block; margin-top: 20px; font-weight: 700; }
      input { box-sizing: border-box; width: 100%; margin-top: 7px; padding: 11px; border: 1px solid #cfd9d2; border-radius: 9px; font: inherit; }
      button { margin-top: 22px; border: 0; border-radius: 9px; background: #172223; color: #fff; padding: 11px 17px; font: 700 14px system-ui, sans-serif; cursor: pointer; }
      #status { min-height: 24px; margin-top: 14px; font-weight: 600; color: #286247; }
      .hint { color: #596861; } code { background: #edf3ed; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>English Review 自动同步</h1>
      <p class="hint">令牌只保存在本机 Chrome 扩展存储中，不会写入聊天内容、网页或 Git。</p>
      <label>上传地址<input id="endpoint" type="url" required></label>
      <label>专用同步令牌<input id="token" type="password" autocomplete="off" required></label>
      <button id="save" type="button">保存设置</button>
      <p id="status" role="status"></p>
      <p class="hint">在 <code>englishTranning</code> 项目设置中粘贴配套指令。结束练习时，ChatGPT 会输出一个同步标记；扩展检测到它后自动上传。</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
